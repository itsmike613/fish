<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>FISH</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="./Source/Styles/index.css" />
</head>

<body>
	<div id="world"></div>

	<div id="ui">
		<div id="card" class="card">
			<div class="cardHead">
				<div class="label">FISH</div>
				<div id="clock" class="clock">12:00 AM</div>
			</div>

			<button id="fishBtn" class="btn" type="button">
				<span id="fishText" class="btnText">Fish</span>
				<span class="btnBar" aria-hidden="true">
					<span id="barFill" class="btnFill"></span>
				</span>
			</button>
		</div>
	</div>

	<div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>

	<div id="backpack" class="overlay hidden" aria-hidden="true">
		<div class="pack">
			<div class="packHead">
				<div class="packLeft">FISH</div>
				<div class="packMid">Backpack</div>
				<div id="packClock" class="packRight">12:00 AM</div>
			</div>

			<div id="grid" class="grid" role="grid" aria-label="Backpack grid"></div>
		</div>

		<div id="info" class="info">Hover an item to see details</div>

		<div id="cursor" class="cursor hidden" aria-hidden="true">
			<img id="cursorImg" alt="" />
			<div id="cursorQty" class="cursorQty"></div>
		</div>
	</div>

	<div id="loreView" class="loreView hidden" aria-hidden="true">
		<img id="loreImg" alt="Lore file" />
	</div>

	<script type="module" src="./Source/Scripts/index.js"></script>
</body>

</html>
