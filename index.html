<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Fish</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="./Source/Styles/index.css" />
</head>

<body>
	<canvas id="bg" aria-hidden="true"></canvas>

	<div id="ui">
		<div id="toastWrap" aria-live="polite" aria-atomic="true"></div>

		<div id="card" class="card">
			<div class="cardTop">
				<div class="label" id="labelLeft">FISH</div>
				<div class="label" id="labelTime">00:00</div>
			</div>
			<button id="fishBtn" class="btn" style="--p: 0%;">
				<span class="btnText">Fish</span>
			</button>
		</div>
	</div>

	<div id="bag" class="modal hidden" role="dialog" aria-modal="true" aria-label="Backpack">
		<div class="bagWindow">
			<div class="bagHead">
				<div class="label">FISH</div>
				<div class="title">Backpack</div>
				<div class="label" id="bagTime">00:00</div>
			</div>

			<div id="grid" class="grid" aria-label="Inventory grid"></div>

			<div id="info" class="info">
				<div id="infoText">Hover an item to see details</div>
			</div>
		</div>

		<div id="held" class="held hidden" aria-hidden="true"></div>
	</div>

	<div id="loreView" class="lore hidden" role="dialog" aria-modal="true" aria-label="Lore file viewer">
		<img id="loreImg" alt="Lore file" />
		<div class="hint">Click / ESC / E to return</div>
	</div>

	<script type="module" src="./Source/Scripts/index.js"></script>
</body>

</html>
